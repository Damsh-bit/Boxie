name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · tipos · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos de rutas de Next
        run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Tests (dominio, motor de temáticas y base con PGlite)
        run: npm test
      - name: Tipos de la base al día con las migraciones
        run: npm run db:types:check
      - name: Catálogo inicial al día con supabase/seed
        run: npm run themes:check
      - name: Build
        run: npm run build

  e2e:
    name: E2E (catálogo, checkout y regalo de ejemplo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PAYMENTS_PROVIDER: fake
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase local (migraciones + catálogo inicial)
        run: |
          supabase start -x studio,imgproxy
          supabase status -o json 2>/dev/null | sed -n '/^{/,$p' > "$RUNNER_TEMP/supabase.json"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
