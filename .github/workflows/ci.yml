name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · tipos · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos de rutas de Next
        run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Tests (dominio, motor de temáticas y base con PGlite)
        run: npm test
      - name: Tipos de la base al día con las migraciones
        run: npm run db:types:check
      - name: Catálogo inicial al día con supabase/seed
        run: npm run themes:check
      - name: Build
        # Si falla, las últimas líneas del build quedan en una anotación: se leen
        # en el resumen (y por la API) sin iniciar sesión en GitHub.
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            tail -n 400 "$RUNNER_TEMP/build.log" \
              | sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' \
              | grep -v '"level":"warn"' \
              | tail -n 45 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/build-tail.txt"
            echo "::error title=Falló el build::$(cat "$RUNNER_TEMP/build-tail.txt")"
            exit 1
          }

  e2e:
    name: E2E (catálogo, checkout, editor y regalo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PAYMENTS_PROVIDER: fake
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # La misma versión que la del proyecto (package.json). Con "latest" la
          # acción consulta la API de GitHub y a veces corta por límite de pedidos.
          version: 2.117.0
      - name: Supabase local (migraciones + catálogo inicial)
        run: |
          supabase start -x studio,imgproxy
          supabase status -o json 2>/dev/null | sed -n '/^{/,$p' > "$RUNNER_TEMP/supabase.json"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' "$RUNNER_TEMP/supabase.json")"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
